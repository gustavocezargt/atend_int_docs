site_name: Atendente Inteligente
site_description: Documentação oficial do Atendente Inteligente
site_author: Atendente Inteligente
site_url: https://docs.atendenteinteligente.com.br

theme:
  name: material

  language: pt-BR

  logo: assets/logo.png
  favicon: assets/favicon.ico

  palette:
    - scheme: default
      primary: green
      accent: light green
      toggle:
        icon: material/weather-night
        name: Modo escuro

    - scheme: slate
      primary: green
      accent: light green
      toggle:
        icon: material/weather-sunny
        name: Modo claro

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy

nav:
  - Início: index.md

  - Documentos:
      - Política de Privacidade: legal/politica-de-privacidade.md
      - Termos de Uso: legal/termos-de-uso.md

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

plugins:
  - search